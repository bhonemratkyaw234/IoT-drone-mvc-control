# WireGuard overlay — AIRCRAFT companion (10.8.0.10)
# Install: sudo cp wg0-aircraft.conf /etc/wireguard/wg0.conf
#          sudo chmod 600 /etc/wireguard/wg0.conf
#          sudo systemctl enable --now wg-quick@wg0
# Replace <PRIVATE_KEY>, <HUB_PUBLIC_KEY>, <GROUND_PUBLIC_KEY>, <VPS_HOST>.
[Interface]
Address = 10.8.0.10/24
ListenPort = 51820
PrivateKey = <AIRCRAFT_PRIVATE_KEY>
MTU = 1380
# Mark tunnel traffic so policy routing can pin it to a WAN if desired (table 100).
# FwMark = 0x64

# --- Hub (VPS) ---
[Peer]
PublicKey = <HUB_PUBLIC_KEY>
Endpoint = <VPS_HOST>:51820
AllowedIPs = 10.8.0.0/24
PersistentKeepalive = 25

# --- Ground station (direct when ground has a public endpoint) ---
# [Peer]
# PublicKey = <GROUND_PUBLIC_KEY>
# Endpoint = <GROUND_HOST>:51820
# AllowedIPs = 10.8.0.20/32
# PersistentKeepalive = 25
