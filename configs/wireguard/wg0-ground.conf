# WireGuard overlay — GROUND station (10.8.0.20)
# Install: sudo cp wg0-ground.conf /etc/wireguard/wg0.conf
#          sudo chmod 600 /etc/wireguard/wg0.conf
#          sudo systemctl enable --now wg-quick@wg0
[Interface]
Address = 10.8.0.20/24
PrivateKey = <GROUND_PRIVATE_KEY>
MTU = 1380
ListenPort = 51820

# --- Hub (VPS) ---
[Peer]
PublicKey = <HUB_PUBLIC_KEY>
Endpoint = <VPS_HOST>:51820
AllowedIPs = 10.8.0.0/24
PersistentKeepalive = 25

# --- Direct to aircraft when aircraft has a reachable endpoint ---
# [Peer]
# PublicKey = <AIRCRAFT_PUBLIC_KEY>
# Endpoint = <AIRCRAFT_HOST>:51820
# AllowedIPs = 10.8.0.10/32
# PersistentKeepalive = 25
