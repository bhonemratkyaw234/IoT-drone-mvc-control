# WireGuard overlay — VPS HUB (10.8.0.1)
# Used when both aircraft and ground are behind CGNAT. The hub routes between spokes.
# Enable forwarding: net.ipv4.ip_forward=1
# Install: sudo cp wg0-hub.conf /etc/wireguard/wg0.conf && sudo systemctl enable --now wg-quick@wg0
[Interface]
Address = 10.8.0.1/24
ListenPort = 51820
PrivateKey = <HUB_PRIVATE_KEY>
MTU = 1380
# Route spoke-to-spoke traffic through the hub:
PostUp   = iptables -A FORWARD -i wg0 -o wg0 -j ACCEPT
PostDown = iptables -D FORWARD -i wg0 -o wg0 -j ACCEPT

# --- Aircraft ---
[Peer]
PublicKey = <AIRCRAFT_PUBLIC_KEY>
AllowedIPs = 10.8.0.10/32

# --- Ground ---
[Peer]
PublicKey = <GROUND_PUBLIC_KEY>
AllowedIPs = 10.8.0.20/32
