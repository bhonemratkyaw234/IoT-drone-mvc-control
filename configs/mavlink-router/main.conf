# /etc/mavlink-router/main.conf
# Routes MAVLink between the flight controller and the GCS over the wg0 overlay.
# Docs: https://github.com/mavlink-router/mavlink-router
[General]
# TCP server for GCS/high-reliability sessions (connect over wg0).
TcpServerPort=5760
# Route MAVLink traffic in both directions.
ReportStats=true
# Emit periodic MAVLink heartbeat so the FC sees a GCS if needed.
# (Usually the GCS itself emits heartbeats; keep false unless required.)
# MavlinkDialect=auto

[UartEndpoint fc]
Device=/dev/fc
Baud=921600
# Auto-detect ArduPilot vs PX4.
# FlowControl=true

[UdpEndpoint gcs]
Mode=Normal
Address=10.8.0.20
Port=14550

# Local loopback for onboard autonomy (MAVSDK/ROS).
[UdpEndpoint local_autonomy]
Mode=Normal
Address=127.0.0.1
Port=14540

# Optional TCP client to a GCS that listens on 5780.
# [TcpEndpoint gcs_tcp]
# Address=10.8.0.20
# Port=5780
